[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sonarch"
version = "0.1.0.dev1"
description = "The one import you need for audio work: loading, preprocessing, features, codecs and datasets, ready for ML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Aman Trivedi" }]
keywords = ["audio", "machine-learning", "preprocessing", "spectrogram", "pytorch", "codec"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "av>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torchaudio>=2.1",
    "pyloudnorm>=0.1",
    "maturin>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/trivedi-aman/sonarch"
Issues = "https://github.com/trivedi-aman/sonarch/issues"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "sonarch._core"
profile = "release"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Benchmarks build closures in loops and call them immediately.
"benchmarks/*" = ["B023", "E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["sonarch"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sonarch.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

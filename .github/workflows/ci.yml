name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CPU-only torch: the default Linux/Windows wheels pull in ~2 GB of CUDA.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: pip install "ruff>=0.6" "mypy>=1.11" numpy torch av
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --release --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build and install (Rust engine + Python package)
        run: pip install -e ".[dev]"
      - name: Check the Rust engine is loaded
        run: python -c "import sonarch._core as c; print('native engine OK', c.decode)"
      - run: pytest -q
